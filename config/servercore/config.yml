# The main configuration file for ServerCore.
# Most of these settings can be reloaded without restarting using /servercore reload.
# Kronwerke: tuned after the load tests in November 2026, see the pack CHANGELOG (0.11.34).

features:
  prevent-moving-into-unloaded-chunks: true
  autosave-interval-seconds: 300
  xp-merge-fraction: 40
  xp-merge-radius: 0.5
  item-merge-radius: 1.5
  lobotomize-villagers:
    enabled: true
    tick-interval: 20

# Lowers the mob caps first and the spawning radius second, never the simulation or view distance,
# so machines and farms in loaded chunks keep running.
dynamic:
  enabled: true
  target-mspt: 40
  default-values:
    MOBCAP_PERCENTAGE: 100
    CHUNK_TICK_DISTANCE: 6
  dynamic-settings:
    - setting: 'MOBCAP_PERCENTAGE'
      max: 100
      min: 60
      increment: 10
      interval: 15

    - setting: 'CHUNK_TICK_DISTANCE'
      max: 6
      min: 4
      increment: 1
      interval: 15

    - setting: 'MOBCAP_PERCENTAGE'
      max: 60
      min: 40
      increment: 10
      interval: 15

breeding-cap:
  enabled: true
  villagers:
    limit: 32
    range: 64
    unlimited-height: false
  animals:
    limit: 48
    range: 64
    unlimited-height: false

mob-spawning:
  zombie-reinforcements:
    enforce-mobcap: true
    additional-capacity: 32
  nether-portal-randomticks:
    enforce-mobcap: true
    additional-capacity: 32
  # Spawner farms (Apothic Spawners) stay as they are.
  monster-spawners:
    enforce-mobcap: false
    additional-capacity: 32
  infested:
    enforce-mobcap: true
    additional-capacity: 32
  categories:
    - category: 'MONSTER'
      mobcap: 60
      spawn-interval: 2
      despawn-distance: 128

    - category: 'CREATURE'
      mobcap: 10
      spawn-interval: 400
      despawn-distance: 128

    - category: 'AMBIENT'
      mobcap: 6
      spawn-interval: 20
      despawn-distance: 96

    - category: 'AXOLOTLS'
      mobcap: 5
      spawn-interval: 10
      despawn-distance: 128

    - category: 'UNDERGROUND_WATER_CREATURE'
      mobcap: 5
      spawn-interval: 10
      despawn-distance: 128

    - category: 'WATER_CREATURE'
      mobcap: 5
      spawn-interval: 10
      despawn-distance: 128

    - category: 'WATER_AMBIENT'
      mobcap: 10
      spawn-interval: 10
      despawn-distance: 64

    - category: 'AETHER_AETHER_AERWHALE'
      mobcap: 1
      spawn-interval: 2
      despawn-distance: 128

    - category: 'AETHER_AETHER_DARKNESS_MONSTER'
      mobcap: 5
      spawn-interval: 2
      despawn-distance: 128

    - category: 'AETHER_AETHER_SKY_MONSTER'
      mobcap: 4
      spawn-interval: 2
      despawn-distance: 128

    - category: 'AETHER_AETHER_SURFACE_MONSTER'
      mobcap: 15
      spawn-interval: 2
      despawn-distance: 128

    - category: 'UNDERGARDEN_STUPID_MOB_CATEGORY'
      mobcap: 50
      spawn-interval: 400
      despawn-distance: 128

commands:
  status-enabled: true
  mobcaps-enabled: true
  colors:
    primary: 'dark_aqua'
    secondary: 'green'
    tertiary: 'aqua'

# Only mobs are slowed down when no player is near. Everything without its own type below
# (contraptions, minecarts, items, projectiles, modded machines) ticks as normal: a tick
# interval of 1 excludes it. Worker mobs (Starbuncles, spirits, drones, the Robit) and the
# Chaos Guardian are excluded by name.
activation-range:
  enabled: true
  tick-new-entities: true
  use-vertical-range: false
  skip-non-immune: false
  villager-tick-panic: true
  villager-work-immunity-after: 20
  villager-work-immunity-for: 20
  excluded-entity-types:
    - 'minecraft:hopper_minecart'
    - 'minecraft:ghast'
    - 'minecraft:warden'
    - 'ars_nouveau:starbuncle'
    - 'ars_nouveau:whirlisprig'
    - 'ars_nouveau:drygmy'
    - 'ars_nouveau:amethyst_golem'
    - 'ars_nouveau:wixie'
    - 'ars_nouveau:bookwyrm'
    - 'occultism:foliot'
    - 'occultism:djinni'
    - 'occultism:afrit'
    - 'occultism:marid'
    - 'pneumaticcraft:drone'
    - 'pneumaticcraft:logistics_drone'
    - 'pneumaticcraft:harvesting_drone'
    - 'pneumaticcraft:collector_drone'
    - 'pneumaticcraft:guard_drone'
    - 'pneumaticcraft:amadrone'
    - 'mekanism:robit'
    - 'draconicevolution:draconic_guardian'
    - 'draconicevolution:guardian_crystal'
  default-activation-type:
    activation-range: 16
    tick-interval: 1
    wakeup-interval: -1
    extra-height-up: false
    extra-height-down: false

  custom-activation-types:
    - name: 'raider'
      activation-range: 48
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'typeof:raider'

    - name: 'water'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 60
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:water_animal'

    - name: 'villager'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 30
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:villager'

    - name: 'zombie'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'minecraft:zombie'
        - 'minecraft:husk'

    - name: 'monster-below'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: true
      entity-matcher:
        - 'minecraft:creeper'
        - 'minecraft:slime'
        - 'minecraft:magma_cube'
        - 'minecraft:hoglin'

    - name: 'flying-monster'
      activation-range: 48
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'minecraft:ghast'
        - 'minecraft:phantom'

    - name: 'monster'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'typeof:monster'

    - name: 'animal'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 60
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:animal'
        - 'typeof:ambient'

    - name: 'creature'
      activation-range: 24
      tick-interval: 20
      wakeup-interval: 30
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:mob'
