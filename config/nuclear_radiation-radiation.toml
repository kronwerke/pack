[features]
	#Per-feature simulation toggles. Only checked if GeneralConfig.radiationEnabled is true.
	#Disabling a feature stops it from registering/ticking world state, which can improve server performance.
	#Radioactive items sitting in containers (chests, barrels, etc.) act as world radiation sources
	container_radiation = true
	#Radioactive items carried in an entity's inventory/armor/hands irradiate that entity (and nearby entities)
	inventory_radiation = true
	#Placed radioactive blocks act as world radiation sources (including direct contact when stood on)
	block_radiation = true
	#Radioactive item entities dropped in the world act as radiation sources
	itementity_radiation = true
	#Radioactive fluids act as world radiation sources
	fluid_radiation = true
	#Radiation sources contaminate the air/water/soil of nearby chunks over time, and contaminated chunks irradiate entities within them
	chunk_contamination = true

[radiation]
	#Chunk vector recompute / source decay / contamination spread interval
	# Default: 5
	# Range: 1 ~ 1200
	world_sim_interval_ticks = 5
	#Entity sampling / dose accumulation / effect interval
	# Default: 5
	# Range: 1 ~ 1200
	entity_sim_interval_ticks = 5
	#Hard cutoff radius for source contribution (meters)
	# Default: 64
	# Range: 1 ~ 1024
	max_source_radius_m = 64
	#ChunkRadVector freshness ttl
	# Default: 40
	# Range: 1 ~ 1200
	chunk_vector_ttl_ticks = 40
	#Spread entity dose calc across interval buckets
	stagger_entities = true

[entities]
	#Creative players are still simulated and synced (HUD/geiger), but exempt from radiation harm
	ignore_creative = true
	#Spectator players are still simulated and synced (HUD/geiger), but exempt from radiation harm
	ignore_spectator = true
	ignored = ["minecraft:armor_stand", "minecraft:item", "minecraft:experience_orb", "minecraft:area_effect_cloud"]

[thresholds_sv_per_hour]
	#MEDIUM band: 1 mSv/h
	# Default: 0.001
	# Range: 0.0 ~ 1000000.0
	mild = 0.01
	#ELEVATED band: 500 mSv/h
	# Default: 0.5
	# Range: 0.0 ~ 1000000.0
	moderate = 0.5
	#HIGH band: 10 Sv/h
	# Default: 10.0
	# Range: 0.0 ~ 1000000.0
	severe = 10.0
	#EXTREME band: 100 Sv/h
	# Default: 100.0
	# Range: 0.0 ~ 1000000.0
	lethal = 100.0
	#Legacy chronic scaling constant. No longer used by the stage formula (kept for datapack/back-compat).
	# Default: 5.0
	# Range: 1.0E-6 ~ 1000000.0
	total_sv_scale_k = 5.0

[thresholds_career_sv]
	#Accumulated career dose (real Sv) that triggers each harm stage, anchored to acute
	#whole-body radiobiology (LD50 ~4-5 Sv). Entity stage = max(rate band, career band).
	#Stage 1 at this career Sv
	# Default: 0.5
	# Range: 0.0 ~ 1000000.0
	mild = 1.0
	#Stage 2 at this career Sv
	# Default: 2.0
	# Range: 0.0 ~ 1000000.0
	moderate = 3.0
	#Stage 3 at this career Sv
	# Default: 5.0
	# Range: 0.0 ~ 1000000.0
	severe = 6.0
	#Stage 4 at this career Sv
	# Default: 8.0
	# Range: 0.0 ~ 1000000.0
	lethal = 10.0

[recovery]
	# Default: 1.0E-4
	# Range: 0.0 ~ 1.0
	base_decay_per_hour_sv = 1.0E-4

[conversion]
	#Conversion factor from Bq to Gy/s at point of exposure. Physical baseline ~5e-18 for pure-gamma 1m distance; mod uses 1e-16 to balance contact handheld + simulation pipeline.
	# Default: 1.0E-16
	# Range: 0.0 ~ 1.0
	gy_per_bq_second = 1.0E-16

[inventory]
	# Default: 0.75
	# Range: 0.0 ~ 1.0
	armor_blocks_inventory = 0.75
	#Fraction of alpha radiation that escapes inventory containers/clothing to reach the body. Alpha particles are stopped by ~1 cm of any material, so default is 0 (fully blocked). Raise to simulate exposed/handheld items.
	# Default: 0.0
	# Range: 0.0 ~ 1.0
	inventory_alpha_pass = 0.0
	#Fraction of beta radiation that escapes inventory containers/clothing to reach the body. Beta particles are stopped by a few mm of plastic or cm of cloth, default 0.2 (most blocked).
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	inventory_beta_pass = 0.2
	#List of GUI menu Registry IDs to ignore (e.g. appeng:crafting_terminal). Items in these menus will not emit radiation.
	ignored_menus = []

[background]
	#Global background radiation in uSv/h applied everywhere when no level/biome override matches.
	# Default: 0.1
	# Range: 0.0 ~ 1000000.0
	default_usv_per_hour = 0.1
	#Per-dimension background radiation in uSv/h. Format: "<dim_id>=<value>".
	#Overrides default; biome entries override this.
	level_usv_per_hour = ["minecraft:the_nether=1.5", "nuclearcraft:wasteland=1500.5", "nuclearcraftneohaul:wasteland=1500.5", "creatingspace:earth_orbit=2500.0", "creatingspace:mars=13000.0", "creatingspace:the_moon=15000.0", "creatingspace:moon_orbit=16000.0", "creatingspace:mars_orbit=13500.0", "creatingspace:venus=14000.0", "minecraft:the_end=1.3"]
	#Per-biome background radiation in uSv/h. Format: "<biome_id>=<value>".
	#Highest priority; overrides level and default.
	biome_usv_per_hour = ["minecraft:nether_wastes=50.0", "nuclearcraftneohaul:wasteland=1500.0", "nuclearcraft:wasteland=1500.0", "createnucleartech:fallout=1500.0", "minecraft:deep_dark=70.0"]

[debug]
	#Sync chunk radiation vector at player to client for in-world arrow rendering
	debug_radiation_vectors = false

[world_sources]
	# Default: 1.0
	# Range: 0.0 ~ 1.0E30
	activity_floor_bq = 1.0
	#Minimum activity (Bq) for an item/block/fluid to register as a world radiation source. Below this, the source is ignored by the in-world simulation (block placement, item entities on ground, container contents). Inventory exposure still counts all items regardless of this threshold. Default 1.0e6 (1 MBq).
	# Default: 5.0E9
	# Range: 0.0 ~ 1.0E30
	world_source_min_bq = 5.0E9
	# Default: 0.001
	# Range: 0.0 ~ 1.0
	contamination_spread_factor = 0.001
	#Isotopes with effective half-life (after isotopeDecayMultiplier) above this many IRL years are treated as static: no decay math, no daughter ingrowth, no expiry. Activity Bq is still computed and shown. Default 1000 yr captures U-238/U-235/Pu-239.
	# Default: 1000.0
	# Range: 0.0 ~ 1.0E15
	static_half_life_years = 1000.0

[block_irradiation]
	#Strong world sources transform nearby blocks over time (datapack recipe driven)
	enabled = true
	#Ticks between irradiation sampling passes
	# Default: 200
	# Range: 1 ~ 24000
	interval_ticks = 200
	#Source activity (Bq) floor to be considered for block irradiation (cheap pre-gate)
	# Default: 5.0E9
	# Range: 0.0 ~ 1.0E30
	min_source_bq = 5.0E9
	#Max ray length (blocks) cast from each source
	# Default: 8
	# Range: 1 ~ 128
	radius = 8
	#Random rays cast per source per interval; each ray irradiates the first solid block it hits (occlusion-aware)
	# Default: 10
	# Range: 1 ~ 1000
	rays_per_source = 10
	#Cap on sources sampled per interval to prevent oversized jobs
	# Default: 64
	# Range: 1 ~ 200
	max_sources_per_job = 64
	#Safety cap on setBlock calls per drain
	# Default: 10
	# Range: 1 ~ 1000
	max_transforms_per_drain = 10

[gas]
	#Minimum source activity (Bq) to emit a radioactive gas cloud (radon/xenon). Default 2.0e11 = 200 GBq.
	# Default: 2.0E11
	# Range: 0.0 ~ 1.0E30
	gas_source_threshold_bq = 2.0E11
	#Base gas cloud radius in blocks at the threshold activity.
	# Default: 8
	# Range: 1 ~ 256
	gas_base_radius_blocks = 8
	#Extra activity (Bq) above threshold that grows the cloud by 1 block. Default 2.0e11 = +1 block per 200 GBq.
	# Default: 2.0E11
	# Range: 1.0 ~ 1.0E30
	gas_radius_step_bq = 2.0E11
	#Hard cap on gas cloud radius (blocks).
	# Default: 48
	# Range: 1 ~ 256
	gas_max_radius_blocks = 48
	#Per entity-sim-interval chance a player inside a gas cloud inhales (no head gas protection).
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	gas_inhale_chance = 0.15
	#Lung pollution (0..1) added per inhale.
	# Default: 0.03
	# Range: 0.0 ~ 1.0
	gas_pollution_per_inhale = 0.03
	#Lung pollution (0..1) added per entity-sim-interval when airborne-contaminant items (tag nr:airborne_contaminant) are carried without head gas protection.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	lung_dust_pollution_per_interval = 0.01
	#Passive lung pollution (0..1) cleared per entity-sim-interval. Scaled up by an active radiation_purge effect.
	# Default: 0.004
	# Range: 0.0 ~ 1.0
	lung_recovery_per_interval = 0.004
	#Pollution (0..1) at/above which lungs reach MID stage (applies Weakness).
	# Default: 0.34
	# Range: 0.0 ~ 1.0
	lung_mid_threshold = 0.34
	#Pollution (0..1) at/above which lungs reach HIGH stage (lung cancer: Weakness II + damage).
	# Default: 0.75
	# Range: 0.0 ~ 1.0
	lung_high_threshold = 0.75
	#Damage dealt per damage interval at HIGH lung stage.
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	lung_cancer_damage = 2.0
	#Ticks between lung cancer damage applications at HIGH stage.
	# Default: 40
	# Range: 1 ~ 24000
	lung_cancer_damage_interval_ticks = 40
