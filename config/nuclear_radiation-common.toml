#Master switch. If false, no radiation simulation runs at all: no world/entity dose simulation, no container/inventory/block/fluid/item-entity/chunk-contamination processing, no tooltips, no JEI/EMI recipe categories.
#Radiation events from 3rd-party mods (Mekanism, NuclearCraft, etc.) are still intercepted so their own vanilla radiation does not apply, but nothing is simulated from them either.
radiationEnabled = true
#Multiplier applied to radiation source isotope decay rate. 1.0 = vanilla half-life; >1.0 decays faster; <1.0 decays slower.
# Default: 1.0
# Range: 0.0 ~ 1000000.0
isotopeDecayMultiplier = 1.0
#Multiplier applied to how fast entities (player, cow, etc.) clean accumulated radiation dose. 1.0 = default; >1.0 recovers faster; <1.0 recovers slower.
# Default: 10.0
# Range: 0.0 ~ 1000000.0
entityDecayMultiplier = 3000.0
#If true, radiation exposure applies mob effects and damage (confusion, weakness, blindness, magic damage) to players. If false, simulation still runs and dose still accumulates, but no harmful effects are applied to players.
radiationHarmEffectsPlayers = true
#If true, radiation exposure applies mob effects and damage to non-player living entities (mobs, animals). If false, simulation still runs and dose still accumulates, but no harmful effects are applied to those entities.
radiationHarmEffectsMobs = true
